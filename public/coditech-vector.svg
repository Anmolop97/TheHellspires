<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="c-top" x1="120" y1="110" x2="380" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#00BBF9" />
    </linearGradient>
    <linearGradient id="c-back" x1="100" y1="120" x2="260" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#0582CA" />
      <stop offset="100%" stop-color="#00F5D4" />
    </linearGradient>
    <linearGradient id="c-bottom" x1="120" y1="390" x2="380" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#00BBF9" />
    </linearGradient>
    <linearGradient id="c-inner-fold" x1="220" y1="180" x2="160" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00BBF9" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#003566" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="brackets-grad" x1="230" y1="190" x2="330" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#70E000" />
      <stop offset="40%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#00BBF9" />
    </linearGradient>
    <linearGradient id="slash-grad" x1="260" y1="180" x2="280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#00BBF9" />
    </linearGradient>

    <!-- Ambient Neon Glow -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="bracket-glow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Group with subtle drop-shadow -->
  <g filter="url(#neon-glow)">
    <!-- Outer Ribbon "C" -->
    <!-- Top Arm: sweeps from top right inward and curves down -->
    <path d="M 370 120 C 375 120, 380 124, 380 130 C 376 150, 340 180, 240 180 C 180 180, 140 215, 140 256 C 140 297, 180 332, 240 332 C 340 332, 376 362, 380 382 C 380 388, 375 392, 370 392 L 230 392 C 140 392, 85 330, 85 256 C 85 182, 140 120, 230 120 Z" 
          fill="url(#c-back)" />

    <!-- Ribbon 3D Facet/Fold: inner geometric depth -->
    <path d="M 230 120 C 140 120, 85 182, 85 256 L 140 256 C 140 215, 180 180, 240 180 L 370 120 Z" 
          fill="url(#c-top)" />

    <!-- Bottom Arm Facet -->
    <path d="M 230 392 C 140 392, 85 330, 85 256 L 140 256 C 140 297, 180 332, 240 332 L 370 392 Z" 
          fill="url(#c-bottom)" />

    <!-- Inner fold ambient shading for that metallic ribbon twist -->
    <path d="M 85 256 C 85 220, 105 180, 140 155 L 180 200 C 160 215, 150 235, 150 256 C 150 277, 160 297, 180 312 L 140 357 C 105 332, 85 292, 85 256 Z" 
          fill="url(#c-inner-fold)" />
  </g>

  <!-- Central Floating Code Glyphs: </> with crisp geometry and neon glow -->
  <g filter="url(#bracket-glow)">
    <!-- Left bracket < -->
    <path d="M 270 215 L 225 256 L 270 297" 
          stroke="url(#brackets-grad)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Center Slash / -->
    <path d="M 298 200 L 270 312" 
          stroke="url(#slash-grad)" 
          stroke-width="18" 
          stroke-linecap="round" />

    <!-- Right bracket > -->
    <path d="M 305 215 L 350 256 L 305 297" 
          stroke="url(#brackets-grad)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
